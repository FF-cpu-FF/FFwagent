[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wohnungsagent"
version = "1.0.0"
description = "Automatisierte Wohnungssuche für Frankfurt am Main mit Ranking und KI-Bewertung"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
wohnungsagent = "wohnungsagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",                        # Zeilenlaenge regelt der Formatierer
  "RUF001", "RUF002", "RUF003",  # deutsche Umlaute sind keine Homoglyphen
  "C408",                        # dict(a=1) ist in Testdaten lesbarer als {"a": 1}
]  # deutsche Umlaute sind keine Homoglyphen-Warnung wert

[tool.mypy]
python_version = "3.11"
packages = ["wohnungsagent"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
